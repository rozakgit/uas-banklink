name: bankling
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  app_links: ^7.2.0
  dio: ^5.9.2
  equatable: ^2.0.8
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^10.3.1
  get_it: ^9.2.1
  go_router: ^17.3.0
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.2
  firebase_messaging: ^15.2.4
  google_sign_in: ^6.2.2

  # QR / Camera
  mobile_scanner: ^7.0.0

  # UI Helpers
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  timeago: ^3.7.1
  cupertino_icons: ^1.0.8

  # Services
  local_auth: ^3.0.1
  flutter_local_notifications: ^22.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
